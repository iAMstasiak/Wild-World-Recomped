# Wild World Recomped material tags, written by the texture picker
# (play.ps1 -Pick). [look] says how the effects look: change a number
# and press R in the game to see it. The other lines are the game's
# textures, by a hash of their texels, with their size and format.

[look]
swell = 1   # how much the broad waves light and shade the water
wave-size = 1   # wave size: 2 is twice as big
wave-speed = 1   # how fast the water moves
mirror = 0.5   # how much sky the water reflects, more in the distance
glints = 2   # how bright the glints are
glint-amount = 1   # how many glints there are: 0 to about 2
keep-texture = 0   # how much of the game's own water pattern shows: 0 to 1
tint = 1   # how much the water takes the tint colour: 0 keeps the game's blue
tint-red = 64   # the tint colour
tint-green = 124   # the tint colour
tint-blue = 128   # the tint colour
falls-streaks = 1   # how strong the waterfall's streaks and foam are
falls-speed = 0.6   # how fast they fall; negative if they run the wrong way
opacity = 0.5   # how solid the water is: below 1 is clearer, above 1 hides what is under it
see-through = 0.4   # how much of what the game draws under the water shows: 0 to 1

